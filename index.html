<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>¿Cuánto pagás de ganancias?</title>
</head>
<body>
    <div class="form inicial" id="form">
        <input type="number" id="ganancias" placeholder="500.000,00"  class="input"  onfocus="inicial()">
        <br>
        <button type="submit" onclick="responder()" id="submit" class="submit">Calcular</button>
    </div>

    <div id="respuesta" class="respuesta inicial"> <p></p> </div>
    <script>
        var form = document.getElementById('form');
        var ganancias = document.getElementById("ganancias");
        var respuesta = document.getElementById('respuesta');
        var respuesta_texto = respuesta.getElementsByTagName("p")[0]; 
        var submit =  document.getElementById('submit');

        function calcular_descuento() {
            return ganancias.value * 0.05;
        }

        function mensaje(){
            let descuento = calcular_descuento();
            let descuento_formateado = Intl.NumberFormat('en-US', {
              style: 'currency',
              currency: 'USD',}
              ).format(descuento,  );

            let mensaje = "El monto máximo que podés deducir de tus impuestos a las ganancias es de: " + descuento_formateado + ". Podés donar todo lo que quieras pero no se te descontará más que esta cantidad.";
            
            if(descuento >= 100000){
                    mensaje = mensaje + " OJO: No todas las organizaciones pueden recibir donaciones de más de $100.000. Consultá primero sobre esos límites.";
            }

            return mensaje;
        }   

        function responder(){
            respuesta_texto.textContent = mensaje(descuento) ;
            respuesta.classList.remove('inicial');
            form.classList.remove('inicial');
        }

        function inicial(){
            respuesta.classList.add('inicial');
            form.classList.add('inicial');
        }


        const descuento =  calcular_descuento();

    </script>

    <style>
    *{
      margin:0;
      padding:0;

      -webkit-box-sizing:border-box;
      -moz-box-sizing:border-box;
      box-sizing:border-box;

      color:#eee;
    }

    body{
      position:relative;
      background:#03a9f4;
    }
    
    button{
      border: 3px solid #eee;
      cursor:pointer;
      font-size:1.3em;
  }

/*-------------- saerch section -----------*/
    .form, .respuesta{
      position:relative;

      -webkit-transform:translate(-50%, -50%);
      transform:translate(-50%, -50%);
       -webkit-transition: all .4s linear;
      transition:  all .4s linear;
      
      height:30%;
      width:100%;
      top:10%;
      left:50%;
    }

    .form.inicial{
      height:100%;
      top:50%;
    }

    .form *, .respuesta *{
      position:relative;

      -webkit-transform:translate(-50%, 0%);
      transform:translate(-50%, 0%);

      top:50%;
      left:50%;
      width:70%;
      
      background:transparent;
      outline:none;

    }

    .form .input{
      border:none;
      border-bottom:3px solid #eee;
      font-size:1.8em;
    }

    .form .submit{
      margin-top: 1em;
    }

/*-------------- respuesta -----------*/

    .respuesta.inicial{
        display: none;
    }

    .respuesta{      
      -webkit-transform:translate(-50%, 0%);
      transform:translate(-50%, 0%);

      height: auto;
      margin-top:1em;
    }

    .respuesta p{
      width:70%;
    }

    </style>

</body>
</html>
